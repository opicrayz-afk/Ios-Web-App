<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không Có Kết Nối | No Internet Connection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(-45deg, #1e3a8a, #4c1d95, #0f172a, #be123c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 3rem 2rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            color: #ffffff;
            opacity: 0;
            transform: translateY(30px);
            animation: floatUpIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes floatUpIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            width: 76px;
            height: 76px;
            margin-bottom: 1.5rem;
            color: rgba(255, 255, 255, 0.9);
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0% { transform: translateY(0px); filter: drop-shadow(0 0 8px rgba(255,255,255,0.2)); }
            50% { transform: translateY(-12px); filter: drop-shadow(0 0 16px rgba(255,255,255,0.6)); }
            100% { transform: translateY(0px); filter: drop-shadow(0 0 8px rgba(255,255,255,0.2)); }
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
        }

        .lang-en {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .exit-btn {
            display: block;
            width: 100%;
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .exit-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .exit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414"></path>
        </svg>

        <div class="lang-vi">
            <h1>Không Có Kết Nối Internet</h1>
            <p>Rất tiếc, phiên bản ngoại tuyến hiện không được hỗ trợ. Vui lòng kết nối mạng và mở lại ứng dụng.</p>
        </div>

        <div class="lang-en">
            <h1>No Internet Connection</h1>
            <p>We're sorry, but the offline version is not supported. Please connect to the internet and reopen the app.</p>
        </div>

        <button class="exit-btn" id="exitBtn" onclick="window.location.href='app://exit';">
    Thoát ứng dụng / Exit
        </button>
    </div>

</body>
</html>
